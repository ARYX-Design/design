<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#0e0d15"/>
  <text x="80" y="110" font-size="28" fill="#6c6c7c" letter-spacing="6">COLOR SYSTEM</text>
  <g>
    <rect x="80" y="160" width="330" height="440" rx="36" fill="#7c5cff"/>
    <text x="115" y="520" font-size="44" font-weight="700" fill="#fff">Violet</text><text x="115" y="565" font-size="26" fill="#fff" fill-opacity=".8">#7C5CFF</text>
    <rect x="435" y="160" width="330" height="440" rx="36" fill="#00e5c0"/>
    <text x="470" y="520" font-size="44" font-weight="700" fill="#08130f">Teal</text><text x="470" y="565" font-size="26" fill="#08130f" fill-opacity=".75">#00E5C0</text>
    <rect x="790" y="160" width="330" height="440" rx="36" fill="#ff5c8a"/>
    <text x="825" y="520" font-size="44" font-weight="700" fill="#fff">Coral</text><text x="825" y="565" font-size="26" fill="#fff" fill-opacity=".85">#FF5C8A</text>
  </g>
  <g>
    <rect x="80" y="640" width="240" height="200" rx="28" fill="#ffb347"/>
    <text x="110" y="800" font-size="26" font-weight="700" fill="#2a1a00">Amber</text>
    <rect x="345" y="640" width="240" height="200" rx="28" fill="#16161f" stroke="#fff" stroke-opacity=".15"/>
    <text x="375" y="800" font-size="26" font-weight="700" fill="#f4f4f7">Surface</text>
    <rect x="610" y="640" width="240" height="200" rx="28" fill="#0a0a0f" stroke="#fff" stroke-opacity=".15"/>
    <text x="640" y="800" font-size="26" font-weight="700" fill="#f4f4f7">Ink</text>
    <rect x="875" y="640" width="245" height="200" rx="28" fill="#f4f4f7"/>
    <text x="905" y="800" font-size="26" font-weight="700" fill="#0a0a0f">Paper</text>
  </g>
</svg>
