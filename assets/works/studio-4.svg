<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a2440" flood-opacity=".16"/></filter></defs><rect width="1200" height="900" fill="#E6E2EE"/><g filter="url(#sh)"><rect x="250" y="100" width="700" height="700" rx="18" fill="#FFFFFF"/></g><path d="M250 118 a18 18 0 0 1 18 -18 h664 a18 18 0 0 1 18 18 v72 h-700z" fill="#EEF1F7"/><g transform="translate(285,124) scale(0.85)"><g fill="none" stroke="#0B1220" stroke-width="4" stroke-linecap="round"><path d="M24 8 L6 41"/><path d="M24 8 L42 41"/><path d="M12.9 28 H35.1"/></g><circle cx="24" cy="8" r="5" fill="#0B1220"/><circle cx="6" cy="41" r="4.6" fill="#0B1220"/><circle cx="42" cy="41" r="4.6" fill="#0B1220"/><circle cx="24" cy="28" r="4.3" fill="none" stroke="#0B1220" stroke-width="2.6"/></g><text x="345" y="148" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#0B1220">Support assistant</text><circle cx="352" cy="170" r="5" fill="#2E4BFF"/><text x="364" y="175" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7C8597">Answers from your own help pages</text><rect x="560" y="230" width="350" height="64" rx="20" fill="#0B1220"/><text x="584" y="270" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF">Can I change my delivery date?</text><rect x="290" y="320" width="460" height="170" rx="20" fill="#EEF1F7"/><text x="316" y="360" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0B1220">Yes. You can change it up to 24 hours</text><text x="316" y="390" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0B1220">before dispatch under Orders → Delivery.</text><rect x="316" y="420" width="170" height="40" rx="20" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="2"/><text x="338" y="446" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2E4BFF">Source: Help centre</text><rect x="560" y="520" width="350" height="64" rx="20" fill="#0B1220"/><text x="584" y="560" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF">Talk to a person, please.</text><rect x="290" y="610" width="420" height="64" rx="20" fill="#EEF1F7"/><text x="316" y="650" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0B1220">Sure, connecting you to the team now.</text><rect x="280" y="712" width="640" height="60" rx="30" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="2"/><text x="310" y="749" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7C8597">Type a message…</text><circle cx="888" cy="742" r="20" fill="#0B1220"/><path d="M880 742 h14 M888 735 l7 7 -7 7" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>